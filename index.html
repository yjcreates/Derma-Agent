<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derma Agent | 중증 아토피피부염 예후관리 서비스</title>
<meta name="description" content="중증 아토피피부염 환자 예후관리 서비스 Derma Agent. ACRYL이 만들었습니다.">
<meta name="theme-color" content="#F4F5F9">
<link rel="icon" href="assets/logo-derma-vertical.png">
<link rel="apple-touch-icon" href="assets/logo-derma-vertical.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Derma Agent | 중증 아토피피부염 예후관리 서비스">
<meta property="og:description" content="닥터앤서 3.0 기반, 환자의 16주를 함께하는 AI 예후관리 서비스">
<meta property="og:image" content="assets/logo-derma-vertical.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink:#1A2036; --body:#5A6579; --mut:#8B94A9;
    --pri:#5B6EDF; --pri-deep:#4353C9;
    --bg:#F4F5F9; --line:#E9ECF5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Pretendard Variable", Pretendard, "맑은 고딕", "Malgun Gothic", sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 20px 48px; gap:26px;
  }
  .acryl { height:26px; display:block; }

  .card {
    width:100%; max-width:960px;
    background:#fff; border-radius:28px;
    box-shadow:0 18px 50px rgba(26,32,54,.07);
    padding:44px 40px;
    text-align:center;
  }

  /* ---- Derma Agent card (link) ---- */
  a.card {
    text-decoration:none; color:inherit; display:block;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  a.card:hover { transform:translateY(-3px); box-shadow:0 24px 60px rgba(91,110,223,.16); }
  a.card:active { transform:translateY(-1px); }
  .hero-row {
    display:flex; align-items:center; justify-content:center;
    gap:clamp(28px, 6vw, 72px); flex-wrap:wrap;
  }
  .hero-title {
    font-size:clamp(21px, 2.6vw, 30px); font-weight:800;
    line-height:1.45; letter-spacing:-.7px; word-break:keep-all;
  }
  .hero-logo { height:clamp(44px, 6vw, 72px); display:block; }
  .cta {
    display:inline-flex; align-items:center; gap:8px;
    margin-top:28px; padding:13px 26px; border-radius:999px;
    background:linear-gradient(135deg,#5B6EDF,#7C8AF0); color:#fff;
    font-size:15px; font-weight:800; letter-spacing:-.2px;
    box-shadow:0 10px 24px rgba(91,110,223,.35);
  }
  .cta svg { width:16px; height:16px; }
  .fund {
    margin-top:26px; font-size:12px; line-height:1.7; color:var(--mut);
    letter-spacing:-.2px; word-break:keep-all;
  }

  /* ---- products ---- */
  .ask {
    font-size:clamp(17px, 2vw, 21px); font-weight:800;
    letter-spacing:-.5px; color:var(--ink); text-align:center; line-height:1.5;
  }
  .products {
    display:grid; grid-template-columns:1fr 1fr 1fr;
  }
  .prod {
    padding:14px 18px; display:flex; flex-direction:column;
    align-items:center; gap:12px;
    border-left:1px solid var(--line);
  }
  .prod:first-child { border-left:none; }
  .prod .sym { height:64px; display:flex; align-items:flex-end; }
  .prod .sym img { max-height:64px; max-width:88px; display:block; }
  .prod h3 { font-size:clamp(17px, 2vw, 22px); font-weight:800; letter-spacing:-.2px; }
  .prod p { font-size:clamp(12px, 1.4vw, 14px); color:var(--body); font-weight:600; letter-spacing:-.3px; word-break:keep-all; }
  .booth {
    margin-top:30px; font-size:13px; font-weight:700; color:var(--pri-deep);
    background:#EEF1FE; border:1px solid #DCE2FB; border-radius:999px;
    display:inline-block; padding:9px 20px; letter-spacing:-.2px; word-break:keep-all;
  }

  /* ---- mobile ---- */
  @media (max-width: 640px) {
    body { justify-content:flex-start; padding-top:48px; gap:22px; }
    .card { padding:34px 24px; border-radius:24px; }
    .hero-row { flex-direction:column; gap:18px; }
    .products { grid-template-columns:1fr; }
    .prod { border-left:none; border-top:1px solid var(--line); padding:22px 8px; }
    .prod:first-child { border-top:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; }
  }
</style>
</head>
<body>

<img class="acryl" src="assets/logo-acryl.png" alt="ACRYL">

<!-- Derma Agent : 소개 페이지로 이동 -->
<a class="card" href="intro.html" aria-label="Derma Agent 소개 페이지 보기">
  <div class="hero-row">
    <div class="hero-title">중증 아토피피부염<br>예후관리 서비스</div>
    <img class="hero-logo" src="assets/logo-derma-horizontal.png" alt="Derma Agent">
  </div>
  <span class="cta">소개 페이지 보기
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </span>
  <div class="fund">본 연구는 과학기술정보통신부의 지원을 받아 수행된 '의료AI혁신생태계조성(닥터앤서3.0)' 사업의 연구 결과입니다.</div>
</a>

<div class="ask">아크릴 제품이<br>더 궁금하다면?</div>

<div class="card">
  <div class="products">
    <div class="prod">
      <div class="sym"><img src="assets/symbol-nadia.png" alt="NADIA-ANE"></div>
      <h3>NADIA-ANE</h3>
      <p>AI-Native EMR · 응용 제품</p>
    </div>
    <div class="prod">
      <div class="sym"><img src="assets/symbol-allmh.png" alt="ALLM.H"></div>
      <h3>ALLM.H</h3>
      <p>지능형 코어 · 파운데이션 모델</p>
    </div>
    <div class="prod">
      <div class="sym"><img src="assets/symbol-jonathan.png" alt="Jonathan.H"></div>
      <h3>Jonathan.H</h3>
      <p>AI Infra · AgentOps 플랫폼</p>
    </div>
  </div>
  <div class="booth">자세한 이야기는 아크릴 제품 소개 부스에서 들려드릴게요</div>
</div>

</body>
</html>
